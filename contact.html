<!DOCTYPE html>
<html lang="tr">
<head><link rel="icon" href="/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TsuTabi - İletişim</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bangers&display=swap" rel="stylesheet">
    <script src="/cookie-banner.js"></script>
    <!-- Supabase JS Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Ortak CSS Dosyası (Navbar, Footer ve genel stiller) -->
    <link rel="stylesheet" href="/style.css">
    
    <style>
        :root {
            --card-bg: #fffbf0;
            --parchment-border: #fde047;
            --parchment-input-bg: rgba(255, 255, 255, 0.9);
        }

        body.dark-mode {
            --card-bg: rgba(30, 41, 59, 0.9);
            --parchment-border: #d97706;
            --parchment-input-bg: rgba(15, 23, 42, 0.8);
        }

        body {
            position: relative;
        }

        /* --- İLETİŞİM / PARŞÖMEN ALANI (Sadece Bu Sayfaya Özel) --- */
        .main-content-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 3rem 1rem;
        }

        .contact-container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 10;
        }

        .anime-card {
            background: var(--card-bg);
            backdrop-filter: var(--backdrop-blur);
            border-radius: 1.5rem;
            border: 3px solid var(--parchment-border);
            box-shadow: 0 15px 35px rgba(234, 179, 8, 0.15);
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .anime-card::before, .anime-card::after {
            content: "";
            position: absolute;
            height: 100%;
            width: 12px;
            top: 0;
            background: linear-gradient(to bottom, #d97706, #b45309, #d97706);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }
        .anime-card::before { left: 0; }
        .anime-card::after { right: 0; }

        .form-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-family: 'Bangers', cursive, sans-serif;
            font-size: 2.6rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #d97706 0%, #ec4899 50%, #9333ea 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }

        .form-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .ninja-avatars-row {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
            flex-wrap: wrap;
        }

        .ninja-avatar-option {
            background: var(--btn-bg);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }

        .ninja-avatar-option:hover {
            transform: scale(1.15) rotate(5deg);
            border-color: #d97706;
        }

        .ninja-avatar-option.selected {
            background: linear-gradient(135deg, #fef08a 0%, #fed7aa 100%);
            border-color: #d97706;
            box-shadow: 0 0 15px rgba(217, 119, 6, 0.4);
            transform: scale(1.1);
        }

        .anime-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .input-group-anime {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .input-group-anime label {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .anime-select, .anime-textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--parchment-input-bg);
            border: 2px solid var(--parchment-border);
            border-radius: 0.85rem;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-dark);
            outline: none;
            transition: all 0.25s;
        }

        .anime-select:focus, .anime-textarea:focus {
            background: var(--card-bg);
            border-color: #d97706;
            box-shadow: 0 0 12px rgba(217, 119, 6, 0.2);
        }

        .anime-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-shinobi-send {
            background: linear-gradient(135deg, #d97706 0%, #ec4899 50%, #9333ea 100%);
            color: #fff;
            padding: 1rem;
            border-radius: 1rem;
            font-family: 'Bangers', cursive, sans-serif;
            font-size: 1.4rem;
            letter-spacing: 1.5px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.3);
            transition: all 0.3s;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-shinobi-send:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(217, 119, 6, 0.5);
        }

        /* IŞINLANMA (HIRAISHIN) JUTSU ANİMASYONU */
        .jutsu-portal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(147,51,234,0.9) 0%, rgba(15,23,42,0.98) 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transform: scale(0);
            transition: all 0.6s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .jutsu-portal-overlay.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .jutsu-seal-ring {
            position: absolute;
            width: 350px;
            height: 350px;
            border: 4px dashed #fde047;
            border-radius: 50%;
            animation: spinRing 4s linear infinite;
        }

        .jutsu-seal-ring-inner {
            position: absolute;
            width: 250px;
            height: 250px;
            border: 3px dotted #ec4899;
            border-radius: 50%;
            animation: spinRingReverse 3s linear infinite;
        }

        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinRingReverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }

        .jutsu-content {
            text-align: center;
            z-index: 10;
            color: #fff;
            padding: 0 1rem;
            animation: pulseJutsu 1s infinite alternate;
        }

        @keyframes pulseJutsu {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px #fde047); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 25px #ec4899); }
        }

        .jutsu-avatar-fly {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: flyAway 1s forwards ease-in;
        }

        @keyframes flyAway {
            0% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            50% { transform: translateY(-30px) scale(1.3) rotate(180deg); }
            100% { transform: translateY(-120px) scale(0) rotate(720deg); opacity: 0; }
        }

        /* BAŞARI MÜHÜR MODALI */
        .success-seal-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 1rem;
        }

        .success-seal-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .seal-content {
            background: var(--card-bg);
            border: 4px solid #d97706;
            padding: 2.5rem;
            border-radius: 1.5rem;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            transform: scale(0.7);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .success-seal-modal.active .seal-content {
            transform: scale(1);
        }

        .seal-icon {
            font-size: 3.5rem;
            margin-bottom: 0.75rem;
        }

        /* --- MODERN TOAST BİLDİRİM STİLLERİ --- */
        #toast-container {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }
        .tsu-toast {
            pointer-events: auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: var(--backdrop-blur);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 0.875rem 1.25rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 280px;
            max-width: 380px;
            transform: translateX(120%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
        }
        .tsu-toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        .tsu-toast-icon {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .tsu-toast-content {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            flex: 1;
        }
        .tsu-toast-title {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--text-dark);
        }
        .tsu-toast-msg {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.35;
        }
        .tsu-toast.success { border-left: 4px solid var(--primary-anime); }
        .tsu-toast.error { border-left: 4px solid #ef4444; }

        @media (max-width: 768px) {
            .anime-card { padding: 1.5rem 1rem; border-width: 2px; }
            .anime-card::before, .anime-card::after { width: 8px; }
            .form-header h2 { font-size: 2rem; }
            .jutsu-seal-ring { width: 260px; height: 260px; }
            .jutsu-seal-ring-inner { width: 180px; height: 180px; }
        }
    </style>
</head>
<body>

    <!-- Dinamik Toast Konteyneri -->
    <div id="toast-container"></div>

    <!-- app.js üzerinden navbar.html buraya yüklenecek -->
    <div id="navbar-placeholder"></div>

    <!-- İletişim Parşömen Alanı -->
    <div class="main-content-wrapper">
        <div class="contact-container">
            <div class="anime-card">
                
                <div class="form-header">
                    <h2>İLETİŞİM PARŞÖMENİ</h2>
                    <p>Parşömeni mühürle ve Supabase'e ışınla! 📜✨</p>
                </div>

                <!-- Ninja Yüzleri -->
                <div class="ninja-avatars-row">
                    <div class="ninja-avatar-option selected" onclick="selectAvatar(this)" title="Klon Ninja">🦊</div>
                    <div class="ninja-avatar-option" onclick="selectAvatar(this)" title="Samuray Ruh">⚔️</div>
                    <div class="ninja-avatar-option" onclick="selectAvatar(this)" title="Alev Büyücüsü">🔥</div>
                    <div class="ninja-avatar-option" onclick="selectAvatar(this)" title="Gözcü Shinobi">👁️</div>
                    <div class="ninja-avatar-option" onclick="selectAvatar(this)" title="Bulut Çiçeği">🍡</div>
                </div>

                <form class="anime-form" id="shinobiForm" onsubmit="handleSupabaseSubmit(event)">

                    <div class="input-group-anime">
                        <label for="msgType">📜 Görev / Mesaj Türü</label>
                        <select id="msgType" class="anime-select" required>
                            <option value="" disabled selected>Parşömen türü seçin...</option>
                            <option value="💡 İstek">💡 İstek</option>
                            <option value="🌸 Teşekkür">🌸 Teşekkür</option>
                            <option value="⚡ Sorun">⚡ Sorun</option>
                            <option value="📜 Diğer">📜 Diğer</option>
                        </select>
                    </div>

                    <div class="input-group-anime">
                        <label for="message">✍️ Parşömen İçeriği</label>
                        <textarea id="message" class="anime-textarea" placeholder="Buraya parşömen metnini kaleme al..." required></textarea>
                    </div>

                    <button type="submit" class="btn-shinobi-send" id="sendBtn">
                        <span>GÖNDER ⚡</span>
                    </button>

                </form>
            </div>
        </div>
    </div>

    <!-- IŞINLANMA (HIRAISHIN) JUTSU ANİMASYON EKRANI -->
    <div id="jutsuPortal" class="jutsu-portal-overlay">
        <div class="jutsu-seal-ring"></div>
        <div class="jutsu-seal-ring-inner"></div>
        <div class="jutsu-content">
            <div class="jutsu-avatar-fly" id="portalEmoji">🦊</div>
            <h2 style="font-family: 'Bangers', cursive; font-size: 2.2rem; letter-spacing: 2px; color: #fde047;">HIRAISHIN NO JUTSU! 🌀</h2>
            <p style="font-size: 0.9rem; opacity: 0.9; margin-top: 0.25rem;">Parşömen veritabanına ışınlanıyor...</p>
        </div>
    </div>

    <!-- BAŞARI MÜHÜR MODALI -->
    <div id="successModal" class="success-seal-modal">
        <div class="seal-content">
            <div class="seal-icon" id="modalEmoji">🦊</div>
            <h3 style="font-family: 'Bangers', cursive; font-size: 1.8rem; color: var(--text-dark); margin-bottom: 0.5rem;">GÖREV BAŞARILI!</h3>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1.25rem;">Parşömen başarıyla mühürlendi!</p>
            <button onclick="closeSuccessModal()" class="btn btn-anime" style="width: 100%; padding: 0.6rem;">Geri Dön</button>
        </div>
    </div>

    <!-- app.js üzerinden footer.html buraya yüklenecek -->
    <div id="footer-placeholder"></div>

    <!-- Script Kodları -->
    <script>
        let selectedEmoji = '🦊';

        /* --- TOAST BİLDİRİM TETİKLEYİCİSİ --- */
        function showToast(message, type = 'success', title = '') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `tsu-toast ${type}`;
            
            const icon = type === 'success' ? '🌸' : '⚠️';
            const defaultTitle = type === 'success' ? 'Harika!' : 'Dikkat!';
            
            toast.innerHTML = `
                <div class="tsu-toast-icon">${icon}</div>
                <div class="tsu-toast-content">
                    <span class="tsu-toast-title">${title || defaultTitle}</span>
                    <span class="tsu-toast-msg">${message}</span>
                </div>
            `;

            container.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 10);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function selectAvatar(element) {
            document.querySelectorAll('.ninja-avatar-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedEmoji = element.innerText;
        }

        async function handleSupabaseSubmit(event) {
            event.preventDefault();

            let activeUser = window.currentUser;
            if (!activeUser) {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    activeUser = session.user;
                    window.currentUser = activeUser;
                }
            }

            if (!activeUser) {
                showToast('Parşömen göndermek için önce oturum açmalısın, shinobi!', 'error', 'Yetkisiz İşlem');
                setTimeout(() => {
                    window.location.href = '/register';
                }, 1500);
                return;
            }

            const msgType = document.getElementById('msgType').value;
            const messageText = document.getElementById('message').value.trim();
            const nickname = window.userProfile?.nickname || activeUser.email.split('@')[0];

            document.getElementById('portalEmoji').innerText = selectedEmoji;
            document.getElementById('modalEmoji').innerText = selectedEmoji;
            const portal = document.getElementById('jutsuPortal');
            portal.classList.add('active');

            try {
                const { error } = await supabaseClient
                    .from('feedbacks')
                    .insert([
                        {
                            user_id: activeUser.id,
                            nickname: `${selectedEmoji} ${nickname}`,
                            title: msgType,
                            content: messageText,
                            is_checked: false
                        }
                    ]);

                setTimeout(() => {
                    portal.classList.remove('active');
                    if (error) {
                        showToast('Parşömen yolda engellendi: ' + error.message, 'error', 'Hata');
                    } else {
                        document.getElementById('successModal').classList.add('active');
                    }
                }, 1500);

            } catch (err) {
                setTimeout(() => {
                    portal.classList.remove('active');
                    showToast('Chakra bağlantı hatası oluştu! İnternet bağlantını kontrol et.', 'error', 'Bağlantı Hatası');
                }, 1500);
            }
        }

        function closeSuccessModal() {
            document.getElementById('successModal').classList.remove('active');
            document.getElementById('shinobiForm').reset();
        }
    </script>
    <!-- Ortak app.js Dosyası (Navbar, footer ve oturum yönetimini sağlar) -->
    <script src="/app.js"></script>
</body>
</html>
